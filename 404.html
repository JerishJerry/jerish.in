<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Jerish David</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family:'Archivo'; font-weight:400 800; font-display:swap;
    src:url("/assets/woff2-806c87c4.woff2") format('woff2'); }
  :root { --bg:#f3f2f2; --text:#201e1d; --accent:#ec3013; --accent-700:#ae1800; }
  *,*::before,*::after { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center;
    background:var(--bg); color:var(--text);
    font-family:'Archivo',system-ui,sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:0 clamp(20px,5vw,72px); }
  .code { font-size:13px; line-height:14px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--accent-700); margin:0 0 28px; }
  h1 { font-weight:800; font-size:clamp(40px,6vw,80px); line-height:1.04;
    letter-spacing:-.03em; margin:0 0 0 -.058em; }
  p.lead { font-size:17px; line-height:28px; max-width:52ch; margin:28px 0 0; }
  .row { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
  a.btn { display:inline-flex; align-items:center; font-weight:800; font-size:14px;
    line-height:1.2; padding:8px 15px; text-decoration:none; }
  .primary { background:var(--accent); color:var(--bg); }
  .primary:hover { background:#dd2b0f; }
  .ghost { color:var(--accent); border:1px solid color-mix(in srgb,var(--text) 40%,transparent); }
  .ghost:hover { background:color-mix(in srgb,var(--accent) 10%,transparent); }
</style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Page not found.</h1>
    <p class="lead">That link does not lead anywhere. The portfolio, experience and
      contact details all live on the home page.</p>
    <div class="row">
      <a class="btn primary" href="/">Back to home</a>
      <a class="btn ghost" href="mailto:jerishdavid23@gmail.com">Email me</a>
    </div>
  </main>
</body>
</html>
