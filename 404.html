<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;background:#191715;color:#f3f2f2;font-family:'Montserrat',system-ui,sans-serif}
main{max-width:1240px;margin:0 auto;padding:0 clamp(20px,5vw,72px)}
.code{font-size:11.5px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:#e1ad66;margin:0 0 26px}

h1 em{color:#e1ad66}
p.lead{font-size:17px;line-height:1.74;max-width:52ch;margin:26px 0 0;color:rgba(243,242,242,.78)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
a.btn{display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;padding:14px 26px;border-radius:4px;text-decoration:none;transition:background .2s ease,border-color .2s ease}
.primary{border:1px solid #b68235;color:#e1ad66}
.primary:hover{background:rgba(225,173,102,.15);border-color:#e1ad66}
.ghost{border:1px solid rgba(243,242,242,.26);color:#f3f2f2}
.ghost:hover{border-color:rgba(243,242,242,.6);background:rgba(243,242,242,.07)}
:focus-visible{outline:2px solid #b68235;outline-offset:2px}

</head>

    <div class="row">
      <a class="btn primary" href="/">Back to home</a>
      <a class="btn ghost" href="mailto:jerishdavid23@gmail.com">Email me</a>

</body>
